# Престол: красивые адреса страниц.
# Этот блок нужно ДОБАВИТЬ в файл .htaccess в корне сайта на хостинге (не заменяя то, что там уже есть).
# Редиректы со старых адресов (product.php?name=…, gallery.php …) делает PHP, здесь их нет.

RewriteEngine On

# Служебные скрипты и файлы шаблона не открываются из браузера
RewriteRule ^tools/ - [F,L]
RewriteRule ^(config|functions|catalog|data|header|footer)\.php$ - [F,L]

# /table, /chair — каталог; /table/teo, /chair/bingo — страница модели
RewriteRule ^(table|chair)/?$ prodlist.php?type=$1 [L,QSA]
RewriteRule ^(table|chair)/([A-Za-z0-9_-]+)/?$ product.php?name=$2 [L,QSA]

# /gallery, /about … — gallery.php, about.php …
RewriteRule ^(gallery|about|contact|address|certificates|sout|feedback)/?$ $1.php [L,QSA]

# Несуществующие адреса — страница 404 (на хостинге эта строка уже есть)
ErrorDocument 404 /404.php
